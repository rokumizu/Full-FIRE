<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>消火栓の最大給水量予測</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link id="stylesheet" rel="stylesheet" href="style-mobile.css">
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('serviceWorker.js');
    }
  </script>
  <style>
    body {
      font-family: 'Yu Gothic', sans-serif;
      background: linear-gradient(to bottom right, #fff3e0, #ffe0b2);
      text-align: center;
      padding: 20px;
      color: #333;
    }

    h1 {
      font-size: 32px;
      color: #bf360c;
      margin-bottom: 30px;
    }

    .form-area {
      background-color: #fffaf0;
      border: 2px solid #ff5722;
      border-radius: 10px;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto 30px;
      box-shadow: 3px 3px 10px rgba(0,0,0,0.1);
    }

    label {
      font-weight: bold;
      display: block;
      margin: 10px 0 5px;
    }

    input {
      width: 80%;
      max-width: 300px;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    #result {
      font-size: 20px;
      font-weight: bold;
      color: #d84315;
    }

    .toggle {
      text-align: right;
      margin: 15px;
      font-size: 14px;
    }

    .toggle button {
      padding: 5px 10px;
      margin-left: 5px;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .toggle button.active {
      background-color: #ff5722;
      color: white;
      font-weight: bold;
    }

    .mode-status {
      text-align: center;
      font-size: 14px;
      margin-bottom: 10px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="toggle">
    表示モード：
    <button id="btn-mobile" class="active" onclick="switchStyle('mobile')">PC</button>
    <button id="btn-pc" onclick="switchStyle('pc')">スマホ</button>
  </div>
  <div class="mode-status" id="modeStatus">現在：PCモード</div>

  <h1>消火栓の最大給水量予測</h1>

  <div class="form-area">
    <label for="staticPressure">静水圧（MPa）：</label>
    <input type="number" id="staticPressure" placeholder="例：0.30" oninput="calculate()">

    <label for="dynamicPressure">動静水圧（MPa）：</label>
    <input type="number" id="dynamicPressure" placeholder="例：0.12" oninput="calculate()">

    <label for="perNozzleFlow">1口の流量（ℓ/分）：</label>
    <input type="number" id="perNozzleFlow" placeholder="例：150" oninput="calculate()">
  </div>

  <div id="result">ここに計算結果が表示されます</div>

  <script>
    function calculate() {
      const staticP = parseFloat(document.getElementById("staticPressure").value);
      const dynamicP = parseFloat(document.getElementById("dynamicPressure").value);
      const perFlow = parseFloat(document.getElementById("perNozzleFlow").value);

      if (!isNaN(staticP) && !isNaN(dynamicP) && staticP > dynamicP) {
        // 放水可能口数（小数点以下切り捨て）
        const rawNozzleCount = Math.pow(staticP / (staticP - dynamicP), 0.54);
        const nozzleCount = Math.floor(rawNozzleCount); // 表示用（切り捨て）
        let resultText = `🚿 放水可能口数：${nozzleCount} 口`;

        if (!isNaN(perFlow) && perFlow > 0) {
          const totalFlow = rawNozzleCount * perFlow; // ← 切り捨てなし × 1口の流量
          resultText += `<br>🚰 給水量の予測値：${Math.round(totalFlow)} ℓ/分`;
        }

        document.getElementById("result").innerHTML = resultText;
      } else {
        document.getElementById("result").textContent = "正しい値を入力してくださいませ！";
      }
    }

    function switchStyle(mode) {
      const stylesheet = document.getElementById('stylesheet');
      const btnMobile = document.getElementById('btn-mobile');
      const btnPC = document.getElementById('btn-pc');
      const modeStatus = document.getElementById('modeStatus');

      if (mode === 'pc') {
        stylesheet.href = 'style-pc.css';
        btnMobile.classList.remove('active');
        btnPC.classList.add('active');
        modeStatus.textContent = '現在：スマホモード';
      } else {
        stylesheet.href = 'style-mobile.css';
        btnPC.classList.remove('active');
        btnMobile.classList.add('active');
        modeStatus.textContent = '現在：PCモード';
      }
    }
  </script>
</body>
</html>
