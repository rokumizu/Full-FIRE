<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>摩擦損失の計算（3種類入力対応）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Yu Gothic', sans-serif;
      background: linear-gradient(to bottom right, #fff3e0, #ffe0b2);
      color: #333;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 30px;
      color: #bf360c;
    }

    .form-section {
      background-color: #fffaf0;
      border: 2px solid #ff5722;
      border-radius: 12px;
      padding: 20px;
      margin: 20px auto;
      max-width: 500px;
      box-shadow: 3px 3px 8px rgba(0,0,0,0.2);
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }

    input {
      padding: 10px;
      width: 80%;
      max-width: 300px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .result {
      margin-top: 10px;
      font-weight: bold;
    }

    #result65 { color: #e53935; }
    #result50 { color: #1e88e5; }
    #result40 { color: #43a047; }

    #total-result {
      margin-top: 40px;
      font-size: 22px;
      font-weight: bold;
      color: #bf360c;
    }
  </style>
</head>
<body>
  <h1>摩擦損失の計算</h1>

  <div class="form-section">
    <h2>65mmホース</h2>
    <label>ホース本数</label>
    <input type="number" id="hose65" oninput="calculate()">
    <label>流量</label>
    <input type="number" id="flow65" oninput="calculate()">
    <div class="result" id="result65">⚠ 入力待ちです</div>
  </div>

  <div class="form-section">
    <h2>50mmホース</h2>
    <label>ホース本数</label>
    <input type="number" id="hose50" oninput="calculate()">
    <label>流量</label>
    <input type="number" id="flow50" oninput="calculate()">
    <div class="result" id="result50">⚠ 入力待ちです</div>
  </div>

  <div class="form-section">
    <h2>40mmホース</h2>
    <label>ホース本数</label>
    <input type="number" id="hose40" oninput="calculate()">
    <label>流量</label>
    <input type="number" id="flow40" oninput="calculate()">
    <div class="result" id="result40">⚠ 入力待ちです</div>
  </div>

  <div id="total-result">トータル摩擦損失がここに表示されます</div>

  <script>
    function calculate() {
      const hose65 = parseFloat(document.getElementById("hose65").value);
      const flow65 = parseFloat(document.getElementById("flow65").value);
      const hose50 = parseFloat(document.getElementById("hose50").value);
      const flow50 = parseFloat(document.getElementById("flow50").value);
      const hose40 = parseFloat(document.getElementById("hose40").value);
      const flow40 = parseFloat(document.getElementById("flow40").value);

      let total = 0;
      let count = 0;

      if (!isNaN(hose65) && !isNaN(flow65)) {
        const loss65 = 0.137 * hose65 * Math.pow(flow65, 2);
        const rounded65 = Math.round(loss65 * 100) / 100;
        document.getElementById("result65").textContent = `摩擦損失：${rounded65} MPa`;
        total += loss65;
        count++;
      } else {
        document.getElementById("result65").textContent = "⚠ 入力待ちです";
      }

      if (!isNaN(hose50) && !isNaN(flow50)) {
        const loss50 = 0.365 * hose50 * Math.pow(flow50, 2);
        const rounded50 = Math.round(loss50 * 100) / 100;
        document.getElementById("result50").textContent = `摩擦損失：${rounded50} MPa`;
        total += loss50;
        count++;
      } else {
        document.getElementById("result50").textContent = "⚠ 入力待ちです";
      }

      if (!isNaN(hose40) && !isNaN(flow40)) {
        const loss40 = 1.569 * hose40 * Math.pow(flow40, 2);
        const rounded40 = Math.round(loss40 * 100) / 100;
        document.getElementById("result40").textContent = `摩擦損失：${rounded40} MPa`;
        total += loss40;
        count++;
      } else {
        document.getElementById("result40").textContent = "⚠ 入力待ちです";
      }

      const roundedTotal = Math.round(total * 100) / 100;
      document.getElementById("total-result").textContent =
        count > 0 ? `✅ トータル摩擦損失：${roundedTotal} MPa` : "すべての入力をしてくださいませ！";
    }
  </script>
</body>
</html>
